<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hecho en Jalisco · Demo de estructura</title>
<meta name="description" content="Demo de estructura para SEDECO Jalisco: seguimiento de agrupaciones hacia una Indicación Geográfica ante el IMPI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja:#FFAB40;
    --naranja-hondo:#B9720A;
    --negro:#0A0A0A;
    --carbon:#1C1C1C;
    --gris:#6E6E6E;
    --gris-claro:#E4E2DE;
    --blanco:#FFFFFF;
    --verde:#204533;
    --terracota:#A2383A;
    --rosa:#D89A9D;
    --azul:#3E7E8C;
    --franja-h:34px;
    --topbar-h:56px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--blanco);
    color:var(--negro);
    font-family:'Karla',sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    letter-spacing:-0.028em;
    line-height:1.03;
    margin:0;
  }
  .mono{
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.1em;
  }
  button,select{font-family:'Karla',sans-serif;font-size:14px;}
  a{color:inherit;}
  button{cursor:pointer;}
  ul,ol{margin:0;padding:0;list-style:none;}
  p{margin:0;}

  /* ---------- foco de teclado ---------- */
  a:focus-visible,button:focus-visible,select:focus-visible,
  [tabindex]:focus-visible,summary:focus-visible,input:focus-visible{
    outline:3px solid var(--naranja-hondo);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
  }

  /* ---------- franja fija ---------- */
  .franja-demo{
    position:sticky;top:0;z-index:60;
    height:var(--franja-h);
    background:var(--negro);
    color:var(--blanco);
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:0 12px;
  }
  .franja-demo span{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:var(--franja-h);z-index:50;
    background:var(--blanco);
    border-bottom:2px solid var(--negro);
    padding:14px 20px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  }
  .marca{display:flex;flex-direction:column;gap:2px;}
  .marca h1{font-size:22px;}
  .marca .mono{color:var(--gris);}
  .roles{display:flex;flex-wrap:wrap;gap:6px;}
  .role-btn{
    background:var(--blanco);
    border:2px solid var(--negro);
    color:var(--negro);
    padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.08em;
  }
  .role-btn[aria-pressed="true"]{
    background:var(--negro);
    color:var(--blanco);
  }
  .role-btn:hover{border-color:var(--naranja-hondo);}

  /* ---------- subbar ---------- */
  .subbar{
    background:var(--gris-claro);
    border-bottom:2px solid var(--negro);
    padding:10px 20px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;
  }
  .subbar.vacia{display:none;}
  .campo{display:flex;flex-direction:column;gap:4px;}
  .campo label{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--gris);}
  .campo select{
    border:2px solid var(--negro);
    background:var(--blanco);
    color:var(--negro);
    padding:6px 8px;
    min-width:170px;
  }
  .volver-btn{
    background:var(--blanco);
    border:2px solid var(--negro);
    padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.08em;
  }
  .volver-btn:hover{border-color:var(--naranja-hondo);}
  .sesion-simulada{
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--gris);
  }

  /* ---------- subnav sedeco ---------- */
  .subnav{gap:4px;padding:0 20px;}
  .subnav-btn{
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    color:var(--gris);
    padding:12px 10px 9px;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.08em;
  }
  .subnav-btn[aria-pressed="true"]{
    color:var(--negro);
    border-bottom-color:var(--naranja);
    font-weight:600;
  }
  .subnav-btn:hover{color:var(--negro);}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

  /* ---------- funnel ---------- */
  .funnel-title{margin-bottom:4px;}
  .funnel-sub{color:var(--gris);margin-bottom:16px;}
  .funnel{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:2px;
    margin-bottom:8px;
  }
  .funnel-col{
    background:var(--negro);
    color:var(--blanco);
    padding:14px 10px;
    min-height:120px;
    min-width:0;
    display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  }
  @media (max-width:760px){
    .funnel{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:420px){
    .funnel{grid-template-columns:repeat(2,1fr);}
  }
  .funnel-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:30px;line-height:1;}
  .funnel-label{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--gris-claro);}
  .funnel-bar{height:5px;background:var(--carbon);}
  .funnel-bar span{display:block;height:100%;background:var(--naranja);}
  .funnel-nota{
    border:2px solid var(--negro);
    border-left:6px solid var(--naranja);
    background:var(--blanco);
    padding:12px 14px;
    margin:16px 0 28px;
  }
  .funnel-nota .mono{color:var(--naranja-hondo);display:block;margin-bottom:4px;}

  /* ---------- alertas ---------- */
  .alertas-wrap{margin-bottom:28px;}
  .alertas-wrap h2{font-size:18px;margin-bottom:10px;}
  .alerta{
    border:2px solid var(--negro);
    border-left:6px solid var(--terracota);
    background:var(--blanco);
    padding:10px 14px;
    margin-bottom:6px;
    display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  }
  .alerta.media{border-left-color:var(--rosa);}
  .alerta .tag{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;
    color:var(--terracota);flex:0 0 auto;
  }
  .alerta.media .tag{color:var(--gris);}
  .alerta .grupo{font-weight:700;}
  .alerta .texto{color:var(--carbon);}

  /* ---------- filtros ---------- */
  .filtros{
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    border:2px solid var(--negro);
    padding:12px 14px;
    margin-bottom:20px;
  }
  .filtros .campo select{min-width:150px;}
  .filtros .contador{margin-left:auto;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--gris);align-self:center;}

  /* ---------- tabla ---------- */
  .tabla-wrap{overflow-x:auto;}
  table.cartera{width:100%;border-collapse:collapse;min-width:760px;}
  table.cartera caption{text-align:left;margin-bottom:8px;}
  table.cartera th{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;
    text-align:left;color:var(--gris);border-bottom:2px solid var(--negro);padding:8px 10px;
  }
  table.cartera td{
    border-bottom:1px solid var(--gris-claro);
    padding:10px;
    vertical-align:middle;
  }
  table.cartera tbody tr{cursor:pointer;}
  table.cartera tbody tr:hover{background:var(--gris-claro);}
  table.cartera tbody tr:focus-visible{background:var(--gris-claro);}
  .producto-nombre{font-weight:700;display:block;}
  .clasif{color:var(--gris);}

  .badge-ig,.badge-mc{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    padding:3px 6px;border:1px solid var(--gris);display:inline-block;white-space:nowrap;
  }
  .badge-mc{background:var(--negro);color:var(--blanco);border-color:var(--negro);}
  .badge-potencial{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    border:1px solid var(--negro);padding:3px 6px;display:inline-block;white-space:nowrap;
  }

  /* ---------- sarape ---------- */
  .sarape{display:flex;gap:2px;width:100%;min-width:140px;}
  .sarape.mini{height:16px;}
  .sarape.grande{height:34px;}
  .hilo{flex:1 1 0;}
  .hilo.completada{background:var(--verde);}
  .hilo.encurso{background:var(--naranja);}
  .hilo.sininiciar{background:var(--gris-claro);}
  .hilo.noaplica{
    background:repeating-linear-gradient(45deg,var(--gris-claro) 0 3px,var(--blanco) 3px 6px);
    border:1px solid var(--gris-claro);
  }
  .sarape-leyenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;}
  .sarape-leyenda .item{display:flex;align-items:center;gap:6px;}
  .sarape-leyenda .swatch{width:14px;height:14px;flex:0 0 auto;}
  .sarape-leyenda .swatch.completada{background:var(--verde);}
  .sarape-leyenda .swatch.encurso{background:var(--naranja);}
  .sarape-leyenda .swatch.sininiciar{background:var(--gris-claro);}
  .sarape-leyenda .swatch.noaplica{background:repeating-linear-gradient(45deg,var(--gris-claro) 0 3px,var(--blanco) 3px 6px);border:1px solid var(--gris-claro);}
  .sarape-leyenda .mono{color:var(--gris);}

  /* ---------- tabla responsiva ---------- */
  @media (max-width:680px){
    table.cartera{min-width:0;}
    table.cartera thead{display:none;}
    table.cartera, table.cartera tbody, table.cartera tr, table.cartera td{display:block;width:100%;}
    table.cartera tr{border:2px solid var(--negro);margin-bottom:12px;padding:10px;}
    table.cartera td{border:0;padding:6px 0;}
    table.cartera td[data-label]::before{
      content:attr(data-label);
      display:block;
      font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--gris);
      margin-bottom:3px;
    }
  }

  /* ---------- asesor / municipio listas simples ---------- */
  .lista-simple-cab{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px;}

  /* ---------- tarjetas (cohortes / mesas / plantillas) ---------- */
  .tarjeta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:14px;}
  .tarjeta{border:2px solid var(--negro);background:var(--blanco);padding:16px;}
  .tarjeta-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;}
  .tarjeta-cab h3{font-size:16px;}
  .tarjeta-cab .mono{color:var(--gris);flex:0 0 auto;}
  .tarjeta-datos{margin:0;}
  .tarjeta-dato{border-top:1px solid var(--gris-claro);padding:6px 0;display:flex;justify-content:space-between;gap:10px;}
  .tarjeta-dato:first-child{border-top:none;}
  .tarjeta-dato dt{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;color:var(--gris);}
  .tarjeta-dato dd{margin:0;font-weight:700;text-align:right;}
  .tarjeta-lista li{padding:4px 0;border-top:1px solid var(--gris-claro);}
  .tarjeta-lista li:first-child{border-top:none;}
  .tarjeta-fija{border-width:3px;}
  .tarjeta-fija p{margin-top:4px;max-width:70ch;}

  .tag-lifecycle{
    display:inline-block;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    padding:4px 8px;border:1px solid var(--negro);
  }
  .tag-hecho{background:var(--negro);color:var(--blanco);border-color:var(--negro);}
  .tag-progreso{background:var(--blanco);color:var(--naranja-hondo);border-color:var(--naranja);}
  .tag-pendiente{background:var(--blanco);color:var(--gris);border:1px dashed var(--gris-claro);}

  /* ---------- ruta de participación municipal ---------- */
  .ruta-municipal-wrap{margin-bottom:26px;}
  .ruta-municipal-wrap > .mono{display:block;margin-bottom:8px;color:var(--gris);}
  .ruta-municipal{display:flex;gap:2px;}
  .ruta-paso{flex:1 1 0;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .ruta-paso-bloque{height:10px;}
  .ruta-paso-bloque.completada{background:var(--verde);}
  .ruta-paso-bloque.encurso{background:var(--naranja);}
  .ruta-paso-bloque.sininiciar{background:var(--gris-claro);}
  .ruta-paso-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;}
  .ruta-paso-nombre{font-size:11.5px;color:var(--gris);line-height:1.25;}
  .ruta-municipal-nota{margin-top:10px;padding-left:10px;border-left:4px solid var(--naranja);font-weight:700;max-width:60ch;}

  /* ---------- ficha ---------- */
  .ficha-back{margin-bottom:14px;}
  .ficha-cab{margin-bottom:14px;}
  .ficha-cab .mono{color:var(--gris);display:block;margin-bottom:6px;}
  .ficha-cab h2{font-size:30px;margin-bottom:6px;}
  .ficha-cab .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}

  .ficha-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:20px;}
  @media (max-width:860px){.ficha-grid{grid-template-columns:1fr;}}

  .panel-negro{
    background:var(--negro);color:var(--blanco);
    padding:18px;align-self:start;
  }
  .panel-negro h3{color:var(--blanco);font-size:15px;margin-bottom:14px;}
  .panel-negro dl{margin:0;}
  .panel-negro .fila{border-top:1px solid var(--carbon);padding:8px 0;}
  .panel-negro .fila:first-of-type{border-top:none;}
  .panel-negro dt{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--gris-claro);margin-bottom:2px;}
  .panel-negro dd{margin:0;font-weight:700;}

  .etapas-list details{border:2px solid var(--negro);margin-bottom:8px;}
  .etapas-list summary{
    list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  }
  .etapas-list summary::-webkit-details-marker{display:none;}
  .etapa-tit{display:flex;gap:12px;align-items:baseline;}
  .etapa-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:var(--gris);}
  .etapa-nombre{font-weight:700;}
  .etapa-resp{color:var(--gris);}
  .estado-tag{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;
    padding:4px 8px;border:1px solid var(--negro);
  }
  .estado-tag.completada{background:var(--verde);color:var(--blanco);border-color:var(--verde);}
  .estado-tag.encurso{background:var(--naranja);color:var(--negro);border-color:var(--naranja);}
  .estado-tag.sininiciar{background:var(--blanco);color:var(--gris);border-color:var(--gris-claro);}
  .estado-tag.noaplica{background:var(--blanco);color:var(--gris);border-color:var(--gris-claro);}

  .etapa-body{padding:0 14px 16px;border-top:2px solid var(--gris-claro);}
  .etapa-body .guia{padding-top:12px;margin-bottom:14px;}
  .etapa-body .guia .mono{color:var(--naranja-hondo);display:block;margin-bottom:4px;}
  .req-list li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 0;border-top:1px solid var(--gris-claro);
  }
  .req-list li:first-child{border-top:none;}
  .req-texto{flex:1 1 220px;}
  .st-tag{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    padding:4px 8px;border:1px solid;white-space:nowrap;
  }
  .st-sincargar{color:var(--gris);border-color:var(--gris-claro);background:var(--gris-claro);}
  .st-cargada{color:var(--naranja-hondo);border-color:var(--naranja);background:var(--blanco);}
  .st-validada{color:var(--blanco);border-color:var(--azul);background:var(--azul);}
  .st-aceptada{color:var(--blanco);border-color:var(--verde);background:var(--verde);}
  .st-rechazada{color:var(--blanco);border-color:var(--terracota);background:var(--terracota);}

  .no-aplica-nota{padding-top:12px;color:var(--gris);}

  .liberar-zona{margin-top:14px;padding-top:14px;border-top:2px dashed var(--gris-claro);}
  .btn-liberar{
    background:var(--negro);color:var(--blanco);border:2px solid var(--negro);
    padding:10px 16px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em;
  }
  .btn-liberar:disabled{background:var(--blanco);color:var(--gris-claro);border-color:var(--gris-claro);cursor:not-allowed;}
  .btn-liberar:not(:disabled):hover{background:var(--naranja-hondo);border-color:var(--naranja-hondo);}
  .falta-nota{display:inline-block;margin-left:10px;color:var(--terracota);font-weight:700;}
  .no-libera-texto{color:var(--gris);border-left:4px solid var(--gris-claro);padding-left:10px;}
  .liberada-msg{color:var(--verde);font-weight:700;}
  .solo-lectura{color:var(--gris);}

  /* ---------- filtro de viabilidad territorial (paso 0) ---------- */
  .filtro-territorial{
    margin-top:26px;border:4px solid var(--negro);padding:18px 20px;background:var(--blanco);color:var(--negro);
  }
  .filtro-territorial.rechazo{background:var(--terracota);color:var(--blanco);border-color:var(--terracota);}
  .filtro-territorial > .mono{display:block;margin-bottom:10px;color:var(--gris);}
  .filtro-territorial.rechazo > .mono{color:var(--rosa);}
  .filtro-pregunta{
    display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    padding:8px 0;border-top:1px solid var(--gris-claro);
  }
  .filtro-pregunta:first-of-type{border-top:none;}
  .filtro-territorial.rechazo .filtro-pregunta{border-top-color:rgba(255,255,255,.3);}
  .alt-si-no{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    border:1px solid currentColor;padding:3px 8px;flex:0 0 auto;
  }
  .veredicto-linea{margin-top:12px;padding-top:12px;border-top:2px solid var(--negro);}
  .filtro-territorial.rechazo .veredicto-linea{border-top-color:rgba(255,255,255,.5);}
  .veredicto-tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:11px;letter-spacing:.08em;
    padding:6px 10px;border:2px solid currentColor;font-weight:600;
  }
  .filtro-alterna{margin-top:10px;max-width:60ch;}

  /* ---------- diagnostico ---------- */
  .diagnostico{
    margin-top:20px;background:var(--naranja);color:var(--negro);padding:20px;
  }
  .diagnostico .mono{display:block;margin-bottom:10px;font-weight:600;}
  .diagnostico h3{font-size:20px;margin-bottom:6px;}
  .diagnostico .aviso{margin-bottom:18px;max-width:60ch;}
  .ejes-cards{display:flex;flex-direction:column;gap:14px;}
  .eje-card{background:var(--blanco);color:var(--negro);border:2px solid var(--negro);padding:16px;}
  .eje-card-cab{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .eje-card-cab h4{font-size:16px;}
  .eje-nivel-tag{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    border:1px solid var(--negro);padding:3px 8px;flex:0 0 auto;white-space:nowrap;
  }
  .eje-proposito{color:var(--gris);max-width:64ch;margin-bottom:12px;}
  .eje-advertencia{border:2px dashed var(--negro);padding:8px 10px;margin-bottom:12px;font-weight:700;}
  .dimensiones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:760px){.dimensiones{grid-template-columns:1fr;}}
  .dimension details{border:1px solid var(--gris-claro);}

/* =========================================================
   PRNG determinista (para datos simulados repetibles)
   ========================================================= */
function hashStr(s){
  var h = 2166136261;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

};

function requisitoStatuses(group, etapaN){
  var count = ETAPAS[etapaN-1].requisitos.length;
  var key = group.id + "-" + etapaN;
  if(OVERRIDES[key]) return OVERRIDES[key];
  var impi = (etapaN===6 || etapaN===7);
  var doneStatus = impi ? "aceptada" : "validada";
  if(etapaN < group.etapaActual){
    var full = []; for(var i=0;i<count;i++) full.push(doneStatus); return full;
  }
  if(etapaN > group.etapaActual){
    var vacio = []; for(var j=0;j<count;j++) vacio.push("sincargar"); return vacio;
  }
  var rnd = mulberry32(hashStr(group.id + "-" + etapaN));
  var pool = impi ? ["sincargar","cargada","validada","aceptada"] : ["sincargar","cargada","validada"];
  var out = [];
  for(var k=0;k<count;k++){
    var idx = Math.floor(rnd()*pool.length);
    if(idx>=pool.length) idx = pool.length-1;
    out.push(pool[idx]);
  }
  var cumplido = function(s){ return s==="validada" || s==="aceptada"; };
  if(out.every(cumplido)) out[0] = "cargada";
  return out;
}

function etapaEstado(group, n){
  if(group.noAplica.indexOf(n) !== -1) return "noaplica";
  if(n < group.etapaActual) return "completada";
  if(n === group.etapaActual) return "encurso";
  return "sininiciar";
}

function flatMap(arr, fn){ var out=[]; arr.forEach(function(x){ out = out.concat(fn(x)); }); return out; }
function uniqueSorted(arr){
  var seen = {}; var out = [];
  arr.forEach(function(x){ if(!seen[x]){ seen[x]=true; out.push(x); } });
  out.sort(function(a,b){ return a.localeCompare(b,"es"); });
  return out;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){

  });
}
function fmtProductores(p){

function fmtFecha(f){
  if(!f) return "—";
  var partes = f.split("-");
  var meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return partes[2] + " " + meses[parseInt(partes[1],10)-1] + " " + partes[0];
}

function renderSarape(group, tam){
  var hilos = ETAPAS.map(function(e){

  }).join("");
  return '<div class="sarape ' + tam + '" role="img" aria-label="Avance de ' + esc(group.producto) + ': ' + sarapeResumen(group) + '">' + hilos + '</div>';
}
function estadoTexto(estado){
  return estado==="completada" ? "completada" : estado==="encurso" ? "en curso" : estado==="noaplica" ? "no aplica" : "sin iniciar";
}
function sarapeResumen(group){
  var c=0,e=0,s=0,n=0;
  ETAPAS.forEach(function(et){
    var st = etapaEstado(group, et.n);
    if(st==="completada") c++; else if(st==="encurso") e++; else if(st==="noaplica") n++; else s++;
  });
  return c + " completadas, " + e + " en curso, " + s + " sin iniciar, " + n + " no aplica";
}

/* =========================================================
   EMBUDO
   ========================================================= */
var FUNNEL_STEPS = [
  {label:"Registradas", test:function(g){ return true; }},
  {label:"Con organización lista", test:function(g){ return g.etapaActual>=2; }},
  {label:"Con persona moral", test:function(g){ return g.etapaActual>=3; }},
  {label:"Expediente ingresado", test:function(g){ return g.etapaActual>=6; }},
  {label:"Declaratoria en DOF", test:function(g){ return g.etapaActual>=7; }},
  {label:"Con autorizaciones de uso", test:function(g){ return g.etapaActual>=9; }}
];

function renderFunnel(groups){
  var total = groups.length || 1;
  var cols = FUNNEL_STEPS.map(function(step, i){
    var n = groups.filter(step.test).length;
    var pct = Math.round((n/total)*100);
    return '' +
      '<div class="funnel-col">' +
        '<div><div class="funnel-num">' + n + '</div><div class="funnel-label">' + step.label + '</div></div>' +
        '<div class="funnel-bar"><span style="width:' + pct + '%"></span></div>' +
      '</div>';
  }).join("");
  return '' +
    '<h2 class="funnel-title">Embudo de avance</h2>' +
    '<p class="funnel-sub mono">' + groups.length + ' agrupaciones en este corte</p>' +
    '<div class="funnel">' + cols + '</div>' +
    '<div class="funnel-nota">' +
      '<span class="mono">Lectura obligada</span>' +
      'Una declaratoria obtenida todavía no significa beneficio para el productor. La columna final — autorizaciones de uso — está en cero incluso para Cajeta de Sayula, la agrupación más avanzada del estado.' +
    '</div>';
}

/* =========================================================
   ALERTAS
   ========================================================= */
function renderAlertas(){
  var altas = ALERTAS.filter(function(a){ return a.sev==="alta"; });
  var medias = ALERTAS.filter(function(a){ return a.sev==="media"; });
  function item(a){
    return '' +
      '<li class="alerta ' + (a.sev==="media"?"media":"") + '">' +
        '<span class="tag">' + (a.sev==="alta"?"Alta":"Media") + '</span>' +
        (a.grupo ? '<span class="grupo">' + esc(a.grupo) + ':</span>' : '') +
        '<span class="texto">' + esc(a.texto) + '</span>' +
      '</li>';
  }
  return '' +
    '<div class="alertas-wrap">' +
      '<h2>Alertas de calidad de datos</h2>' +
      '<ul>' + altas.map(item).join("") + medias.map(item).join("") + '</ul>' +
    '</div>';
}

/* =========================================================
   FILTROS
   ========================================================= */
function renderFiltros(regionesDisp, municipiosDisp, mostrarRegionMunicipio, visibleCount){
  var regionOpts = '<option value="todas">Todas</option>' + regionesDisp.map(function(r){ return '<option value="' + esc(r) + '">' + esc(r) + '</option>'; }).join("");
  var munOpts = '<option value="todas">Todos</option>' + municipiosDisp.map(function(m){ return '<option value="' + esc(m) + '">' + esc(m) + '</option>'; }).join("");
  var etapaOpts = '<option value="todas">Todas</option>' + ETAPAS.map(function(e){ return '<option value="' + e.n + '">' + e.n + '. ' + esc(e.nombre) + '</option>'; }).join("");

  var regionMunicipioHTML = mostrarRegionMunicipio ? (
    '<div class="campo"><label for="filtro-region">Región</label><select id="filtro-region">' + regionOpts + '</select></div>' +
    '<div class="campo"><label for="filtro-municipio">Municipio</label><select id="filtro-municipio">' + munOpts + '</select></div>'
  ) : "";

  return '' +
    '<div class="filtros">' +
      regionMunicipioHTML +
      '<div class="campo"><label for="filtro-etapa">Etapa actual</label><select id="filtro-etapa">' + etapaOpts + '</select></div>' +
      '<span class="contador">' + visibleCount + ' resultado(s)</span>' +
    '</div>';
}

/* =========================================================
   TABLA DE CARTERA
   ========================================================= */
function renderTabla(groups, caption){
  if(groups.length===0){
    return '<p class="mono" style="color:var(--gris);padding:20px 0;">Sin agrupaciones que coincidan con el filtro.</p>';
  }
  var rows = groups.map(function(g){
    var etapaObj = ETAPAS[g.etapaActual-1];
    return '' +
      '<tr tabindex="0" role="button" data-open-ficha="' + g.id + '" aria-label="Abrir ficha de ' + esc(g.producto) + '">' +
        '<td data-label="Producto"><span class="producto-nombre">' + esc(g.producto) + '</span><span class="clasif mono">' + esc(g.clasificacion) + '</span></td>' +
        '<td data-label="Región / municipio">' + esc(g.region) + '<br><span class="clasif">' + esc(g.municipios.join(", ")) + '</span></td>' +
        '<td data-label="Productores">' + fmtProductores(g.productores) + '</td>' +
        '<td data-label="Potencial">' + potencialBadge(g) + '</td>' +
        '<td data-label="Ruta">' + rutaBadge(g) + '</td>' +
        '<td data-label="Etapa actual">' + g.etapaActual + '. ' + esc(etapaObj.nombre) + '</td>' +
        '<td data-label="Avance (sarape)">' + renderSarape(g, "mini") + '</td>' +
      '</tr>';
  }).join("");

  return '' +
    '<div class="tabla-wrap">' +
    '<table class="cartera">' +
      '<caption class="mono" style="color:var(--gris);">' + caption + '</caption>' +
      '<thead><tr>' +
        '<th>Producto</th><th>Región / municipio</th><th>Productores</th><th>Potencial</th><th>Ruta</th><th>Etapa actual</th><th>Avance</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    '</div>' +
    renderLeyendaSarape();
}

function renderLeyendaSarape(){
  return '' +
    '<div class="sarape-leyenda mono">' +
      '<span class="item"><span class="swatch completada"></span>Completada</span>' +
      '<span class="item"><span class="swatch encurso"></span>En curso</span>' +
      '<span class="item"><span class="swatch sininiciar"></span>Sin iniciar</span>' +
      '<span class="item"><span class="swatch noaplica"></span>No aplica</span>' +
    '</div>';
}

/* =========================================================
   VISTAS DE LISTA
   ========================================================= */
function applyFiltros(groups){
  return groups.filter(function(g){
    if(state.filterRegion !== "todas" && g.region !== state.filterRegion) return false;
    if(state.filterMunicipio !== "todas" && g.municipios.indexOf(state.filterMunicipio) === -1) return false;
    if(state.filterEtapa !== "todas" && g.etapaActual !== parseInt(state.filterEtapa,10)) return false;
    return true;
  });
}

function renderSedecoPanorama(){
  return '' +
    renderFunnel(GROUPS) +
    renderAlertas();
}

function renderSedecoCartera(){
  var filtradas = applyFiltros(GROUPS);
  return '' +
    '<h2 style="margin-bottom:12px;">Cartera de agrupaciones</h2>' +
    renderFiltros(REGIONES, MUNICIPIOS, true, filtradas.length) +
    renderTabla(filtradas, "Cartera estatal — SEDECO Jalisco");
}

function renderCohortesView(){
  var cards = COHORTES.map(function(coh){
    var integrantes = GROUPS.filter(function(g){ return g.coh === coh.id; });
    var viabProm = integrantes.length
      ? Math.round(integrantes.reduce(function(sum,g){ return sum + computeDiagnostico(g).ejeScores.viabilidad; }, 0) / integrantes.length)
      : 0;
    var alertaTope = integrantes.length > 12
      ? '<div class="alerta"><span class="tag">Alta</span><span class="texto">Supera el tope de 12 agrupaciones por facilitador que fija el modelo.</span></div>'
      : "";
    var listaIntegrantes = integrantes.map(function(g){
      return '<li>' + esc(g.producto) + '</li>';
    }).join("");
    return '' +
      '<div class="tarjeta">' +
        '<div class="tarjeta-cab"><h3>' + esc(coh.nombre) + '</h3><span class="mono">' + integrantes.length + ' agrupación(es)</span></div>' +
        '<dl class="tarjeta-datos">' +
          '<div class="tarjeta-dato"><dt>Ventana</dt><dd>' + esc(coh.ventana) + '</dd></div>' +
          '<div class="tarjeta-dato"><dt>Facilitador</dt><dd>' + esc(coh.facilitador) + '</dd></div>' +
          '<div class="tarjeta-dato"><dt>Aliado técnico</dt><dd>' + esc(coh.aliado) + '</dd></div>' +
          '<div class="tarjeta-dato"><dt>Viabilidad IG promedio</dt><dd>' + viabProm + ' / 100</dd></div>' +
        '</dl>' +
        alertaTope +
        '<p class="mono" style="margin:12px 0 6px;color:var(--gris);">Integrantes</p>' +
        '<ul class="tarjeta-lista">' + listaIntegrantes + '</ul>' +
      '</div>';
  }).join("");

  var oportunidad = '' +
    '<div class="tarjeta tarjeta-fija">' +
      '<h3>Oportunidad de agrupamiento</h3>' +
      '<p>Barro Canelo, Barro Bruñido y Nacimientos de Barro comparten técnica, territorio y aliado académico; donde sea legalmente viable pueden compartir reglas de uso y una sola certificadora en vez de tramitarlo tres veces.</p>' +
    '</div>';

  return '<h2 style="margin-bottom:12px;">Cohortes</h2>' + '<div class="tarjeta-grid">' + cards + '</div>' + oportunidad;
}

/* =========================================================

   ========================================================= */
function renderMesasView(){
  var META_CONVOCADAS = 100;
  var totalConvocadas = MESAS.reduce(function(s,m){ return s + m.convocadas; }, 0);
  var totalAsistencia = MESAS.reduce(function(s,m){ return s + m.asistencia; }, 0);

  var kpis = '' +
    '<div class="funnel-col">' +
      '<div><div class="funnel-num">' + totalConvocadas + '</div><div class="funnel-label">Convocadas · meta ' + META_CONVOCADAS + '</div></div>' +
      '<div class="funnel-bar"><span style="width:' + Math.min(100,pctConvocadas) + '%"></span></div>' +
    '</div>' +
    '<div class="funnel-col">' +
      '<div><div class="funnel-num">' + totalAsistencia + '</div><div class="funnel-label">Asistencia registrada</div></div>' +
      '<div class="funnel-bar"><span style="width:' + Math.round(totalAsistencia/Math.max(1,totalConvocadas)*100) + '%"></span></div>' +
    '</div>' +
    '<div class="funnel-col">' +
      '<div><div class="funnel-num" style="font-size:20px;">Noviembre 2026</div><div class="funnel-label">Cierre por MIR</div></div>' +
      '<div class="funnel-bar"><span style="width:100%"></span></div>' +
    '</div>';

  var rows = MESAS.map(function(m){
    var actaCargada = m.estado === "Realizada";
    var tagClass = m.estado === "Realizada" ? "tag-hecho" : m.estado === "Convocada" ? "tag-progreso" : "tag-pendiente";
    return '' +
      '<tr>' +
        '<td data-label="Región">' + esc(m.region) + '</td>' +
        '<td data-label="Sede">' + esc(m.sede) + '</td>' +
        '<td data-label="Fecha">' + fmtFecha(m.fecha) + '</td>' +

        '<td data-label="Asistencia">' + m.asistencia + '</td>' +
        '<td data-label="Estado"><span class="tag-lifecycle ' + tagClass + '">' + esc(m.estado) + '</span></td>' +
        '<td data-label="Acta cargada">' + (actaCargada ? "Sí" : "No") + '</td>' +
      '</tr>';

    '<h2 style="margin-bottom:12px;">Mesas regionales</h2>' +

      '<caption class="mono" style="color:var(--gris);">8 mesas regionales programadas</caption>' +

/* =========================================================
   RUTA DE PARTICIPACIÓN MUNICIPAL
   ========================================================= */
function renderRutaMunicipal(municipio){
  var avance = avanceDeMunicipio(municipio);
  var pasoActual = avance < 5 ? avance + 1 : null;
  var pasos = RUTA_MUNICIPAL_PASOS.map(function(p){
    var estado = p.n <= avance ? "completada" : (p.n === pasoActual ? "encurso" : "sininiciar");
    return '' +
      '<div class="ruta-paso">' +
        '<div class="ruta-paso-bloque ' + estado + '"></div>' +
        '<span class="ruta-paso-num">' + p.n + '</span>' +
        '<span class="ruta-paso-nombre">' + esc(p.nombre) + '</span>' +
      '</div>';
  }).join("");
  return '' +
    '<div class="ruta-municipal-wrap">' +
      '<span class="mono">Ruta de participación municipal</span>' +
      '<div class="ruta-municipal">' + pasos + '</div>' +
      '<p class="ruta-municipal-nota">Sin llegar al paso 4 el municipio no puede aportar recursos vía POA.</p>' +
    '</div>';
}

  var deMunicipio = GROUPS.filter(function(g){ return g.municipios.indexOf(state.municipioSel) !== -1; });

function renderAsesorList(){

      '<h2>Tu cartera</h2>' +
      '<span class="mono" style="color:var(--gris);">' + deAsesor.length + ' agrupación(es) asignada(s)</span>' +

/* =========================================================
   FICHA
   ========================================================= */
function renderFicha(group, role){
  if(!group){
    return '<p>No se encontró la agrupación.</p>';
  }
  var alertasGrupo = ALERTAS.filter(function(a){ return a.grupo === group.producto; });
  var alertasHTML = alertasGrupo.length ? (
    '<div class="alertas-wrap" style="margin-top:14px;">' +
      '<ul>' + alertasGrupo.map(function(a){
        return '<li class="alerta ' + (a.sev==="media"?"media":"") + '">' +
          '<span class="tag">' + (a.sev==="alta"?"Alta":"Media") + '</span>' +
          '<span class="texto">' + esc(a.texto) + '</span>' +
        '</li>';
      }).join("") + '</ul>' +
    '</div>'
  ) : "";

  var etapasHTML = ETAPAS.map(function(e){ return renderEtapaDetalle(group, e, role); }).join("");

  return '' +
    '<div class="ficha-cab">' +
      '<span class="mono">' + esc(group.clasificacion) + ' · ' + esc(group.region) + ' · ' + esc(group.municipios.join(", ")) + '</span>' +
      '<h2>' + esc(group.producto) + '</h2>' +
      '<div class="badges">' + rutaBadge(group) + potencialBadge(group) + '</div>' +
    '</div>' +
    renderSarape(group, "grande") +
    renderLeyendaSarape() +
    alertasHTML +
    '<div class="ficha-grid">' +
      '<div class="etapas-list">' + etapasHTML + '</div>' +
      renderPanelNegro(group) +
    '</div>' +
    renderDiagnostico(group);
}

function renderEtapaDetalle(group, e, role){
  var estado = etapaEstado(group, e.n);
  var estadoLabel = {completada:"Completada", encurso:"En curso", sininiciar:"Sin iniciar", noaplica:"No aplica"}[estado];

  var cuerpo;
  if(estado === "noaplica"){
    cuerpo = '<p class="no-aplica-nota">No aplica para esta agrupación: su ruta es de marca colectiva, no de Indicación Geográfica.</p>';
  } else {
    var statuses = requisitoStatuses(group, e.n);
    var reqItems = e.requisitos.map(function(texto, idx){
      var st = statuses[idx];
      return '<li><span class="req-texto">' + esc(texto) + '</span><span class="st-tag st-' + st + '">' + STATUS_LABEL[st] + '</span></li>';
    }).join("");

    var control = "";
    if(estado === "encurso"){
      var faltan = statuses.filter(function(s){ return !cumplido(s); }).length;
      if(role === "agrupacion"){
        control = '<div class="liberar-zona"><p class="no-libera-texto">Tu agrupación no puede liberar esta etapa. Quien revisa y libera es tu asesor técnico.</p></div>';
      } else if(role === "asesor"){
        var key = group.id + "-" + e.n;
        var yaLiberada = !!state.liberaciones[key];
        if(yaLiberada){
          control = '<div class="liberar-zona"><p class="liberada-msg">Etapa liberada. (Cambio de demostración, no se guarda.)</p></div>';
        } else {
          var disabled = faltan > 0 ? "disabled" : "";
          control = '' +
            '<div class="liberar-zona">' +
              '<button type="button" class="btn-liberar" data-liberar="' + key + '" ' + disabled + '>Liberar etapa</button>' +
              (faltan > 0 ? '<span class="falta-nota">Faltan ' + faltan + ' requisito(s)</span>' : '<span class="falta-nota" style="color:var(--verde);">Sin pendientes</span>') +
            '</div>';
        }
      } else {
        control = '<div class="liberar-zona"><p class="solo-lectura">Este perfil solo consulta. La liberación de etapas corresponde al asesor técnico.</p></div>';
      }
    }

    cuerpo = '' +
      '<div class="guia"><span class="mono">Qué hay que hacer</span>' + esc(e.guia) + '</div>' +
      '<ul class="req-list">' + reqItems + '</ul>' +
      control;
  }

  return '' +
    '<details ' + (estado==="encurso" ? "open" : "") + '>' +
      '<summary>' +
        '<span class="etapa-tit"><span class="etapa-num">' + e.n + '</span><span><span class="etapa-nombre">' + esc(e.nombre) + '</span><br><span class="etapa-resp mono">' + esc(e.responsable) + ' · ' + esc(e.duracion) + '</span></span></span>' +
        '<span class="estado-tag ' + estado + '">' + estadoLabel + '</span>' +
      '</summary>' +
      '<div class="etapa-body">' + cuerpo + '</div>' +
    '</details>';
}

function renderPanelNegro(group){
  function fila(label, valor){
    return '<div class="fila"><dt>' + label + '</dt><dd>' + valor + '</dd></div>';
  }
  var filas = '' +
    fila("Clasificación", esc(group.clasificacion)) +
    fila("Región", esc(group.region)) +
    fila("Municipios", esc(group.municipios.join(", "))) +
    fila("Productores", fmtProductores(group.productores)) +
    fila("Potencial", esc(group.potencial)) +
    fila("Ruta", group.ruta==="MC" ? "Marca colectiva" : "Indicación geográfica") +
    fila("Asesor asignado", esc(group.asesor));
  if(group.folioIMPI){
    filas += fila("Folio IMPI", esc(group.folioIMPI));
    filas += fila("Solicitud presentada", fmtFecha(group.fechaSolicitud));
    filas += fila("Declaratoria DOF", fmtFecha(group.fechaDeclaratoria));
  }
  return '<aside class="panel-negro"><h3>Datos de la agrupación</h3><dl>' + filas + '</dl></aside>';
}

  {id:"b", texto:"¿La técnica de elaboración es propia de esta zona y está viva hoy?"},
  {id:"c", texto:"¿Se descarta que exista producción equivalente en otro estado con el mismo nombre?"}
];

var EJES_DIAGNOSTICO = [

// Overrides explícitos pedidos por el cliente (sesgo central 0-4 por dimensión)
var SESGO_OVERRIDES = {
  "cajeta-de-sayula": {organizativa:4, tecnica:4, comercial:4, vinculo:4, evidencia:4, distintividad:4},
  "birote-salado": {distintividad:0.3},
  "chilte-de-talpa": {organizativa:0.3},
  "ceramica-mayolica": {organizativa:0.3}
};

// Overrides del veredicto del Paso 0, atados a alertas ya existentes en ALERTAS
var FILTRO_OVERRIDES = {
  "destilado-tonayan": {c:false},           // alerta: traslape con DO Tequila y el CRT
  "ponche-de-granada": {a:false, c:false}   // alerta: va por marca colectiva, es otra ruta
};

function generarSesgos(group){
  var potNum = group.potencial === "ALTO" ? 3.3 : group.potencial === "MEDIO" ? 2.2 : 1.2;
  var etapaNum = Math.min(4, 0.5 + group.etapaActual * 0.4);
  var tieneProductores = typeof group.productores === "number";
  var alertaTexto = ALERTAS.filter(function(a){ return a.grupo === group.producto; }).map(function(a){ return a.texto; }).join(" ");
  var distintividadBase = potNum;
  if(/uso común|dos formas distintas|traslape/.test(alertaTexto)) distintividadBase = 0.6;
  var sesgos = {
    organizativa: etapaNum,
    tecnica: Math.max(potNum, etapaNum - 0.5),
    comercial: potNum + (tieneProductores ? 0.3 : -0.3),
    vinculo: potNum,
    evidencia: potNum - 0.2,
    distintividad: distintividadBase,
    cohesion: 2.0,
    voluntad: 2.0,
    gestion: tieneProductores ? 2.3 : 1.6
  };
  var over = SESGO_OVERRIDES[group.id];
  if(over){ Object.keys(over).forEach(function(k){ sesgos[k] = over[k]; }); }
  return sesgos;
}

function preguntasDeDimension(seedBase, centro){
  var out = [];
  for(var i=0;i<3;i++){
    var r = mulberry32(hashStr(seedBase + "-" + i))();
    var val = Math.round(centro + (r - 0.5) * 1.6);
    out.push(Math.max(0, Math.min(4, val)));
  }
  return out;
}

function respuestasPaso0(group){
  var potNum = group.potencial === "ALTO" ? 0.75 : group.potencial === "MEDIO" ? 0.55 : 0.35;
  var out = {};
  FILTRO_TERRITORIAL_PREGUNTAS.forEach(function(p){
    var r = mulberry32(hashStr(group.id + "-filtro-" + p.id))();
    out[p.id] = r < potNum;
  });
  var over = FILTRO_OVERRIDES[group.id];
  if(over){ Object.keys(over).forEach(function(k){ out[k] = over[k]; }); }
  return out;
}

function parseDuracionMeses(d){ return parseInt(d, 10) || 0; }

function nivelDe(score){ return score <= 33 ? "Básica" : score <= 66 ? "Intermedia" : "Avanzada"; }

function computeDiagnostico(group){
  var sesgos = generarSesgos(group);
  var respuestas = {}, dimScores = {};
  EJES_DIAGNOSTICO.forEach(function(eje){
    eje.dimensiones.forEach(function(dim){
      var arr = preguntasDeDimension(group.id + "-" + dim.id, sesgos[dim.id]);
      respuestas[dim.id] = arr;
      dimScores[dim.id] = Math.round(((arr[0] + arr[1] + arr[2]) / 3) / 4 * 100);
    });
  });
  var ejeScores = {};
  EJES_DIAGNOSTICO.forEach(function(eje){
    var ds = eje.dimensiones.map(function(dim){ return dimScores[dim.id]; });
    ejeScores[eje.id] = Math.round((ds[0] + ds[1] + ds[2]) / 3);
  });

  var paso0 = respuestasPaso0(group);
  var siCount = (paso0.a?1:0) + (paso0.b?1:0) + (paso0.c?1:0);
  var veredicto = siCount === 3 ? "procede" : siCount === 2 ? "validacion" : "noprocede";

  // TODO: "brecha cerrable en 12 meses" no tiene fórmula definida por el cliente.
  // Proxy provisional: meses restantes de la ruta crítica desde la etapa actual
  // hasta la 9 (sumando ETAPAS.duracion). <=12 meses restantes = 100. Confirmar con SEDECO.
  var mesesRestantes = 0;
  for(var n=group.etapaActual; n<=9; n++){
    if(group.noAplica.indexOf(n) !== -1) continue;
    mesesRestantes += parseDuracionMeses(ETAPAS[n-1].duracion);
  }
  var brechaCerrable = Math.round(Math.min(1, 12/Math.max(1,mesesRestantes)) * 100);
  var prioridad = Math.round(ejeScores.viabilidad * 0.6 + brechaCerrable * 0.4);

  var plan = [];
  if(dimScores.organizativa <= 33) plan.push("Apoyo para constituir legalmente la agrupación y definir estructura de representación y gobernanza interna.");
  else if(dimScores.organizativa <= 66) plan.push("Taller de gobernanza: reglamento interno mínimo y reglas de decisión colectiva.");
  if(dimScores.tecnica <= 66) plan.push("Laboratorio comunitario guiado de 3 horas en territorio: línea de tiempo colectiva, recorrido grabado y mapa participativo.");
  if(dimScores.evidencia < 60) plan.push("Levantamiento de evidencia histórica y documental con aliado académico.");
  if(dimScores.comercial <= 33) plan.push("Vinculación a canales concretos ya identificados por la Secretaría, no teoría de mercado.");
  if(dimScores.distintividad < 50) plan.push("Búsqueda de anterioridades y opinión del IMPI sobre el nombre antes de invertir en estudio técnico.");
  if(dimScores.vinculo < 60) plan.push("Validación de exclusividad territorial frente a producciones similares en otros estados.");
  if(ejeScores.cooperativo >= 67) plan.push("Candidata a estructura cooperativa bajo la Ley de Fomento al Cooperativismo de Jalisco. Informativo, no altera prioridad.");
  if(plan.length === 0) plan.push("Acompañamiento de seguimiento en la etapa vigente.");

  return {respuestas:respuestas, dimScores:dimScores, ejeScores:ejeScores, paso0:paso0, veredicto:veredicto,
          mesesRestantes:mesesRestantes, brechaCerrable:brechaCerrable, prioridad:prioridad, plan:plan};
}

function renderFiltroPaso0(diag){
  var rechazo = diag.veredicto === "noprocede";
  var preguntasHTML = FILTRO_TERRITORIAL_PREGUNTAS.map(function(p){
    var val = diag.paso0[p.id];
    return '' +
      '<div class="filtro-pregunta">' +
        '<span>' + esc(p.texto) + '</span>' +
        '<span class="alt-si-no">' + (val ? "Sí" : "No") + '</span>' +
      '</div>';
  }).join("");
  var veredictoLabel = diag.veredicto === "procede" ? "Procede" : diag.veredicto === "validacion" ? "Requiere validación IMPI" : "No procede como IG";
  var alterna = rechazo ? '<p class="filtro-alterna">Considera marca colectiva como alternativa: protege el origen sin exigir exclusividad territorial.</p>' : "";
  return '' +
    '<div class="filtro-territorial ' + (rechazo ? "rechazo" : "") + '">' +
      '<span class="mono">Paso 0 · Filtro de viabilidad territorial</span>' +
      preguntasHTML +
      '<div class="veredicto-linea">' +
        '<span class="veredicto-tag">' + veredictoLabel + '</span>' +
      '</div>' +
      alterna +
    '</div>';
}

function renderDimension(dim, diag){
  var score = diag.dimScores[dim.id];
  var respuestas = diag.respuestas[dim.id];
  var preguntasHTML = dim.preguntas.map(function(texto, idx){
    return '' +
      '<div class="dimension-pregunta">' +
        '<span>' + esc(texto) + '</span>' +
        '<span class="dimension-resp">' + ESCALA_LABELS[respuestas[idx]] + '</span>' +
      '</div>';
  }).join("");
  return '' +
    '<div class="dimension">' +
      '<details>' +
        '<summary><span>' + esc(dim.nombre) + '</span><span class="eje-nivel-tag">' + score + ' · ' + nivelDe(score) + '</span></summary>' +
        '<div class="dimension-body">' + preguntasHTML + '</div>' +
      '</details>' +
    '</div>';
}

function renderEjeCard(eje, diag){
  var score = diag.ejeScores[eje.id];
  var advertencia = eje.id === "cooperativo"
    ? '<p class="eje-advertencia">Este eje no entra en el cálculo de prioridad. Es información para diseñar acompañamiento, no un criterio de filtro.</p>'
    : "";
  var indicePrioridad = eje.id === "viabilidad"
    ? '<div class="indice-prioridad"><span class="mono">Índice de prioridad (60% viabilidad IG + 40% brecha cerrable en 12 meses, proxy provisional)</span>' + diag.prioridad + ' / 100</div>'
    : "";
  var dimsHTML = eje.dimensiones.map(function(dim){ return renderDimension(dim, diag); }).join("");
  return '' +
    '<div class="eje-card">' +
      '<div class="eje-card-cab"><h4>' + esc(eje.nombre) + '</h4><span class="eje-nivel-tag">' + score + ' · ' + nivelDe(score) + '</span></div>' +
      '<p class="eje-proposito">' + esc(eje.proposito) + '</p>' +
      advertencia +
      '<div class="dimensiones">' + dimsHTML + '</div>' +
      indicePrioridad +
    '</div>';
}

function renderPlanFortalecimiento(diag){
  return '' +
    '<div class="plan-fortalecimiento">' +
      '<h4>Plan de fortalecimiento</h4>' +
      '<ul>' + diag.plan.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>' +
    '</div>';
}

function renderDiagnostico(group){
  var diag = computeDiagnostico(group);
  var ejesHTML = EJES_DIAGNOSTICO.map(function(eje){ return renderEjeCard(eje, diag); }).join("");
  return '' +
    renderFiltroPaso0(diag) +
    '<div class="diagnostico">' +
      '<span class="mono">Instrumento en calibración</span>' +
      '<h3>Diagnóstico</h3>' +
      '<p class="aviso">Cálculo de referencia, no una evaluación oficial. Sirve para priorizar acompañamiento, no para descartar agrupaciones.</p>' +
      '<div class="ejes-cards">' + ejesHTML + '</div>' +
      renderPlanFortalecimiento(diag) +
    '</div>';
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function renderMain(){
  if(state.role === "sedeco"){
    if(state.view === "ficha") return renderFicha(getGroup(state.fichaId), "sedeco");
    if(state.sedecoView === "cartera") return renderSedecoCartera();
    if(state.sedecoView === "cohortes") return renderCohortesView();
    if(state.sedecoView === "mesas") return renderMesasView();
    if(state.sedecoView === "plantillas") return renderPlantillasView();
    return renderSedecoPanorama();
  }
  if(state.role === "municipio"){
    return state.view==="ficha" ? renderFicha(getGroup(state.fichaId), "municipio") : renderMunicipioList();
  }
  if(state.role === "asesor"){
    return state.view==="ficha" ? renderFicha(getGroup(state.fichaId), "asesor") : renderAsesorList();
  }
  if(state.role === "agrupacion"){
    return renderFicha(getGroup(state.agrupacionSel), "agrupacion");
  }
  return "";
}

function renderAll(){
  document.getElementById("topbar").innerHTML = renderTopbar();
  document.getElementById("subbar").innerHTML = renderSubbar();
  document.getElementById("main").innerHTML = renderMain();
  syncSelectValues();
}

function syncSelectValues(){
  var map = {
    "filtro-region": state.filterRegion,
    "filtro-municipio": state.filterMunicipio,
    "filtro-etapa": state.filterEtapa,
    "sel-municipio-rol": state.municipioSel,
    "sel-asesor-rol": state.asesorSel,
    "sel-agrupacion-rol": state.agrupacionSel
  };
  Object.keys(map).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.value = map[id];
  });
}

/* =========================================================
   EVENTOS
   ========================================================= */
function openFicha(id, role){
  state.view = "ficha";
  state.fichaId = id;
  renderAll();
  var main = document.getElementById("main");
  if(main) main.focus && main.focus();
  window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  var roleBtn = e.target.closest("[data-role-btn]");
  if(roleBtn){
    state.role = roleBtn.dataset.roleBtn;
    state.view = "list";
    state.fichaId = null;
    renderAll();
    return;
  }
  var rowEl = e.target.closest("[data-open-ficha]");
  if(rowEl){
    openFicha(rowEl.dataset.openFicha, state.role);
    return;
  }
  var tabBtn = e.target.closest("[data-sedeco-tab]");
  if(tabBtn){
    state.sedecoView = tabBtn.dataset.sedecoTab;
    renderAll();
    return;
  }
  var backEl = e.target.closest("[data-back]");
  if(backEl){
    state.view = "list";
    state.fichaId = null;
    renderAll();
    return;
  }
  var liberarBtn = e.target.closest("[data-liberar]");
  if(liberarBtn && !liberarBtn.disabled){
    state.liberaciones[liberarBtn.dataset.liberar] = true;
    renderAll();
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){
    var rowEl = e.target.closest("[data-open-ficha]");
    if(rowEl){
      e.preventDefault();
      openFicha(rowEl.dataset.openFicha, state.role);
    }
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.id === "filtro-region"){ state.filterRegion = t.value; renderAll(); }
  else if(t.id === "filtro-municipio"){ state.filterMunicipio = t.value; renderAll(); }
  else if(t.id === "filtro-etapa"){ state.filterEtapa = t.value; renderAll(); }
  else if(t.id === "sel-municipio-rol"){ state.municipioSel = t.value; renderAll(); }
  else if(t.id === "sel-asesor-rol"){ state.asesorSel = t.value; renderAll(); }
  else if(t.id === "sel-agrupacion-rol"){ state.agrupacionSel = t.value; renderAll(); }
});

/* =========================================================
   INICIO
   ========================================================= */
renderAll();

})();
</script>
